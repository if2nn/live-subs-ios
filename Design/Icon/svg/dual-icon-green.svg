<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dual icon, light appearance. Glass colour = the three --glass-* stops (colors.json). -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCF4E4"/><stop offset="0.5" stop-color="#C5EED2"/><stop offset="1" stop-color="#AFE9C1"/>
    </linearGradient>
    <clipPath id="glassClip"><rect x="540" y="500" width="328" height="328" rx="72"/></clipPath>
    <filter id="frost"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  <rect id="background" width="1024" height="1024" fill="#FFFFFF"/>
  <rect id="frame" x="186.0" y="174.0" width="580" height="580" rx="118.0" fill="none" stroke="#000" stroke-width="20"/>
  <g id="glass-layer">
    <rect x="540" y="500" width="328" height="328" rx="72" fill="url(#glass)" fill-opacity="0.9" filter="url(#shadow)"/>
    <g clip-path="url(#glassClip)" opacity="0.35"><rect x="186.0" y="174.0" width="580" height="580" rx="118.0" fill="none" stroke="#000" stroke-width="20" filter="url(#frost)"/></g>
    <rect x="540.5" y="500.5" width="327" height="327" rx="72" fill="none" stroke="#FFF" stroke-opacity="0.7" stroke-width="1"/>
  </g>
</svg>
