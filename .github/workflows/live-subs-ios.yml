name: Dual iOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - 'Shared/**'
      - 'Broadcast/**'
      - 'Tests/**'
      - 'project.yml'
      - '*.plist'
      - '.github/workflows/live-subs-ios.yml'
permissions:
  contents: read
jobs:
  # Simulator build + 5 UI tests take ~20 min on the xcode-27 runner;
  # a job that gets no runner is cancelled after ~15 min and needs a re-push.
  # No automatic test retries: a flaky UI query is rerun by hand and reported.
  simulator_ui:
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        # Image 20261104 ships Xcode 27.2 final (Xcode_27.2.app) and dropped the RC;
        # older images still have only the RC. Use whichever exists.
        run: |
          for x in /Applications/Xcode_27.2.app /Applications/Xcode_27.2_Release_Candidate.app; do if [ -d "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; break; fi; done
          xcodebuild -version
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: iOS 27 simulator UI gate
        run: |
          set -o pipefail
          mkdir -p simulator-artifacts
          python3 Tests/run_simulator_tests.py 2>&1 | tee simulator-artifacts/runner.log
      - name: Collect target app evidence
        if: always()
        run: python3 Tests/run_simulator_tests.py --collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dual-iOS27-simulator-evidence
          path: simulator-artifacts/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: simulator_ui
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest documented SDK
        run: |
          for x in /Applications/Xcode_27.2.app /Applications/Xcode_27.2_Release_Candidate.app; do if [ -d "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; break; fi; done
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.2"
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Core assertions
        run: |
          swiftc --version
          python3 Tests/static_checks.py
          python3 Tests/pip_policy_checks.py
          python3 Tests/capture_ipc_checks.py
          swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete Shared/Transcript.swift Shared/Profile.swift Tests/CoreTests.swift -o /tmp/core-tests
          /tmp/core-tests
          swiftc -swift-version 6 Shared/PiPPolicy.swift Tests/PiPPolicyTests.swift -o /tmp/pip-policy-tests
          /tmp/pip-policy-tests
          swiftc -swift-version 6 Shared/CaptureState.swift Tests/CaptureStateTests.swift -o /tmp/capture-state-tests
          /tmp/capture-state-tests
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Dual.xcodeproj -scheme Dual -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Embed personal-resigner metadata and verify bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/Dual.app
          codesign --force --sign - --generate-entitlement-der --entitlements Broadcast/Broadcast.entitlements "$APP/PlugIns/Broadcast.appex"
          codesign --force --sign - --generate-entitlement-der --entitlements App/Dual.entitlements "$APP"
          mkdir -p dist
          python3 Tests/verify_bundle.py "$APP" --output dist/bundle-verification.json
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Dual.app dist/Payload/
          test -d dist/Payload/Dual.app/PlugIns/Broadcast.appex
          cd dist
          zip -qr Dual-unsigned.ipa Payload
          shasum -a 256 Dual-unsigned.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dual-iOS
          path: |
            dist/*.ipa
            dist/SHA256SUMS
            dist/bundle-verification.json
            build.log
          retention-days: 14
